  const font = `${bold?'600':'400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width)+pad*2, h = fontSize+pad*2;
  cv.width = w*dpr; cv.height = h*dpr; ctx.scale(dpr,dpr);
  if(bg){ ctx.fillStyle=bg; const r=h/2; ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(w-r,0); ctx.arc(w-r,r,r,-Math.PI/2,Math.PI/2);
    ctx.lineTo(r,h); ctx.arc(r,r,r,Math.PI/2,-Math.PI/2); ctx.fill(); }
  ctx.font=font; ctx.fillStyle=color; ctx.textBaseline='middle';
  ctx.fillText(text, pad, h/2);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(worldH*w/h, worldH, 1);
  return sp;
}

const R1 = 28, R2 = 16, R3 = 9;
const branchGroups = [], raycastTargets = [], posById = {};

function branchDirs(n){
  const dirs = [], off = 2/n, inc = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = i*off-1+off/2, r = Math.sqrt(1-y*y), phi = i*inc;
    dirs.push(new THREE.Vector3(Math.cos(phi)*r, y*0.75, Math.sin(phi)*r).normalize());
  }
  return dirs;
}
function addSphere(pos, radius, color){
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius,20,16),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(pos); return m;
}
function addLine(a, b, color, opacity){
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),
    new THREE.LineBasicMaterial({color, transparent:true, opacity}));
  l.userData.baseOp = opacity; return l;
}

// root
root3d.add(addSphere(new THREE.Vector3(0,0,0), 2.8, 0xe8eaf0));
const rl = makeLabel(DATA.name, {fontSize:44, bold:true, color:'#0a0e14', bg:'#e8eaf0', worldH:3.4});
rl.position.set(0,4.8,0); root3d.add(rl);

const dirs = branchDirs(DATA.children.length);
const legendEl = document.getElementById('legend');

DATA.children.forEach((branch, bi)=>{
  const color = branch.color || 0x888888;
  const cHex = '#'+color.toString(16).padStart(6,'0');
  const bg = new THREE.Group(); bg.userData = {branchIndex:bi};
  root3d.add(bg); branchGroups.push(bg);

  const lg = document.createElement('div'); lg.className='lg';
  lg.innerHTML = `<span class="dot" style="background:${cHex}"></span>${branch.name}`;
  legendEl.appendChild(lg);

  const p1 = dirs[bi].clone().multiplyScalar(R1);
  bg.add(addLine(new THREE.Vector3(0,0,0), p1, color, 0.95));
  const s1 = addSphere(p1, 1.8, color); s1.userData = {branchIndex:bi};
  bg.add(s1); raycastTargets.push(s1);
  const l1 = makeLabel(branch.name, {fontSize:38, bold:true, color:'#0a0e14', bg:cHex, worldH:2.6});
  l1.position.copy(p1).add(new THREE.Vector3(0,3.2,0)); bg.add(l1);

  const kids = branch.children||[];
  kids.forEach((kid, ki)=>{
    const axis = dirs[bi];
    let o1 = new THREE.Vector3(0,1,0).cross(axis).normalize();
    if(o1.lengthSq()<0.01) o1.set(1,0,0);
    const o2 = axis.clone().cross(o1).normalize();
    const ang = (ki/Math.max(kids.length,1))*Math.PI*2, spread = 0.85;
    const dir2 = axis.clone()
      .add(o1.clone().multiplyScalar(Math.cos(ang)*spread))
      .add(o2.clone().multiplyScalar(Math.sin(ang)*spread)).normalize();
    const p2 = p1.clone().add(dir2.clone().multiplyScalar(R2));
    bg.add(addLine(p1, p2, color, 0.85));
    const sz = kid.sz || 1.0;
    const s2 = addSphere(p2, sz, color); s2.userData = {branchIndex:bi};
    bg.add(s2); raycastTargets.push(s2);
    if(kid._id) posById[kid._id] = p2.clone();
    const l2 = makeLabel(kid.name, {fontSize:32, color:'#dfe3ee', worldH:1.9});
    l2.position.copy(p2).add(new THREE.Vector3(0, sz+1.1, 0)); bg.add(l2);

    (kid.children||[]).forEach((leaf, li)=>{
      const n2 = kid.children.length, a2 = (li/n2)*Math.PI*2+0.5;
      let q1 = new THREE.Vector3(0,1,0).cross(dir2).normalize();
      if(q1.lengthSq()<0.01) q1.set(1,0,0);
      const q2 = dir2.clone().cross(q1).normalize();
      const d3 = dir2.clone()
        .add(q1.clone().multiplyScalar(Math.cos(a2)*0.95))
        .add(q2.clone().multiplyScalar(Math.sin(a2)*0.95)).normalize();
      const p3 = p2.clone().add(d3.multiplyScalar(R3));
      bg.add(addLine(p2, p3, color, 0.7));
      const lsz = leaf.sz ? leaf.sz*0.6 : 0.55;
      const s3 = addSphere(p3, lsz, color); s3.userData = {branchIndex:bi};
      bg.add(s3); raycastTargets.push(s3);
      if(leaf._id) posById[leaf._id] = p3.clone();
      const l3 = makeLabel(leaf.name, {fontSize:28, color:'#9aa3ba', worldH:1.4});
      l3.position.copy(p3).add(new THREE.Vector3(0, lsz+0.9, 0)); bg.add(l3);
    });
  });
});

// cross-domain bonds: curved faint arcs between branches — the "molecule" bonds
const crossGroup = new THREE.Group();
root3d.add(crossGroup);
CROSS.forEach(x=>{
  const a = posById[x.a], b = posById[x.b];
  if(!a || !b) return;
  const mid = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(1.35); // bow outward
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(24));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial(
    {color:0xc9d6ff, transparent:true, opacity:Math.min(0.8, 0.34+x.w*0.16)}));
  line.userData.baseOp = line.material.opacity;
  crossGroup.add(line);
});

// focus
let focused = -1;
function setFocus(bi){
  focused = (focused===bi) ? -1 : bi;
  branchGroups.forEach((g,i)=>{
    const dim = (focused!==-1 && i!==focused);
    g.traverse(o=>{
      if(o.material){
        o.material.transparent = true;
        o.material.opacity = dim ? (o.isLine?0.06:0.12)
                                 : (o.isLine ? (o.userData.baseOp??1) : 1);
      }
    });
  });
  crossGroup.children.forEach(l=>{
    l.material.opacity = (focused===-1) ? l.userData.baseOp : 0.04;
  });
}

// controls — free rotation, zoom, tap
let rotVel = {x:0.0008, y:0.0025};
const BASE_ROT = {x:0.0008, y:0.0025}, IDLE_MS = 3500; let lastAct = 0;
let dragging=false, lastX=0, lastY=0, pinchDist=0, interacted=false, moved=0;
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();

function rotate(dx, dy){
  const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dx);
  const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), dy);
  root3d.quaternion.premultiply(qx).premultiply(qy);
}
function zoom(f){ camDist = THREE.MathUtils.clamp(camDist*f, 18, 320); }

canvas.addEventListener('pointerdown', e=>{
  dragging=true; interacted=true, lastAct=performance.now(); moved=0; lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved += Math.abs(dx)+Math.abs(dy);
  lastX=e.clientX; lastY=e.clientY;
  rotate(dx*0.005, dy*0.005);
  rotVel.x = dy*0.0006; rotVel.y = dx*0.0006;
});
canvas.addEventListener('pointerup', e=>{
  dragging=false;
  if(moved<6){
    pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(raycastTargets);
    if(hits.length) setFocus(hits[0].object.userData.branchIndex);
    else if(focused!==-1) setFocus(focused);
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault(); interacted=true, lastAct=performance.now(); zoom(e.deltaY>0?1.1:0.9);
},{passive:false});

const touches = new Map();
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y); dragging=false;
  }
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    const p = touches.get(t.identifier);
    if(p){ p.x=t.clientX; p.y=t.clientY; }
  }
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchDist>0) zoom(pinchDist/d);
    pinchDist = d; interacted=true, lastAct=performance.now();
  }
},{passive:true});
canvas.addEventListener('touchend', e=>{
  for(const t of e.changedTouches) touches.delete(t.identifier);
  pinchDist=0;
},{passive:true});

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

(function tick(){
  requestAnimationFrame(tick);
  if(dragging) lastAct = performance.now();
  if(!dragging){
    if(!interacted) rotate(rotVel.y, rotVel.x);
    else if(performance.now()-lastAct > IDLE_MS){
      rotVel.x += (BASE_ROT.x-rotVel.x)*0.03; rotVel.y += (BASE_ROT.y-rotVel.y)*0.03;
      rotate(rotVel.y, rotVel.x);
    }
    else { rotVel.x*=0.94; rotVel.y*=0.94; rotate(rotVel.y, rotVel.x); }
  }
  camera.position.set(0,0,camDist);
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
