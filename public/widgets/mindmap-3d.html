<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Box of Rox — 3D Mind Map</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e14; touch-action:none; }
  #c { display:block; width:100%; height:100%; }
  #hud {
    position:fixed; top:0; left:0; right:0; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-family:'Segoe UI',system-ui,sans-serif;
  }
  #title { color:#e8eaf0; }
  #title h1 { font-size:15px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
  #title p { font-size:11px; color:#7a8299; margin-top:2px; }
  #legend {
    display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    font-size:10px; color:#aab2c5; max-width:46%;
  }
  .lg { display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
  #help {
    position:fixed; bottom:10px; left:0; right:0; text-align:center;
    font-family:'Segoe UI',system-ui,sans-serif; font-size:11px; color:#5c6478;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="title"><h1>Box of Rox</h1><p>drag rotate · pinch/scroll zoom · tap node to focus branch</p></div>
  <div id="legend"></div>
</div>
<div id="help"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- DATA ----------
const DATA = {
  name:"BOX OF ROX", children:[
    { name:"Marley1 Edge Mesh", color:0x4fc3f7, children:[
      { name:"Fat Man (Jetson)", children:[{name:"llama.cpp CUDA"},{name:"Qwen 3B / 7B"},{name:"OpenClaw :18789"}]},
      { name:"Little Boy (Pi5)", children:[{name:"Meaning Layer node"},{name:"Translate app :8090"}]},
      { name:"PiDog (Pi4)", children:[{name:"walk_and_see.py"},{name:"Net lockout fix ⚠"}]},
      { name:"Meaning Layer MTP", children:[{name:"Ed25519 trust"},{name:"3-sig relay wedge →"}]},
      { name:"abbrev.py", children:[{name:"Patent filed"},{name:"205 vs 1261 tok"}]},
      { name:"Marley Drive v0.3", children:[{name:"Deferred"}]}
    ]},
    { name:"Web & Games", color:0x81c784, children:[
      { name:"boblemieux.ai", children:[{name:"VoxelCraft"},{name:"Cheeseburgler"},{name:"Flash Frenzy"},{name:"Space Explorer"},{name:"CLAUDE.md fix ⚠"}]},
      { name:"Critter Count"},
      { name:"Tiny Traveler"},
      { name:"Cribbage"},
      { name:"FEC Explorer", children:[{name:"Gov-data gateway →"}]},
      { name:"Vault Raider", children:[{name:"Pivoted @ M5"},{name:"Hudson feel-gate"}]}
    ]},
    { name:"Construction Automation", color:0xffb74d, children:[
      { name:"DC-EVM Tracker", children:[{name:"50,895 budget hrs"},{name:"Unit rates →"},{name:"HVAC disc# fix ⚠"}]},
      { name:"P6 Parser (XER/XML)"},
      { name:"Reforecast Curve"},
      { name:"Power BI Fixes"},
      { name:"Bilingual Safety"}
    ]},
    { name:"AI Ops & Pipelines", color:0xba68c8, children:[
      { name:"Ops Harness", children:[{name:"METHOD-universal"},{name:"\"harness on\""}]},
      { name:"NYT Digest", children:[{name:"6AM task"},{name:"API key env ⚠"}]},
      { name:"Antigravity onboard"},
      { name:"Cowork VM blocker ⚠"}
    ]},
    { name:"VR w/ Kenny", color:0xe57373, children:[
      { name:"H2 ObstacleBoy", children:[{name:"Unity 6.3 scaffold"},{name:"Scenes-as-data"},{name:"Quest 2/3"}]}
    ]},
    { name:"Creative", color:0xfff176, children:[
      { name:"FireWater Casino"},
      { name:"Twisted Pines"},
      { name:"Comedy Country Songs"}
    ]},
    { name:"Infra & Security", color:0x4db6ac, children:[
      { name:"Hardening done"},
      { name:"Bitwarden"},
      { name:"Cred rotation ✓"},
      { name:"Tailscale cleanup →"}
    ]}
  ]
};

// ---------- SCENE ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.010);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
let camDist = 78;
camera.position.set(0,0,camDist);

const root3d = new THREE.Group();
scene.add(root3d);

// subtle starfield
(function(){
  const g = new THREE.BufferGeometry();
  const n = 500, pos = new Float32Array(n*3);
  for(let i=0;i<n*3;i++) pos[i] = (Math.random()-0.5)*600;
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0x2a3550, size:1.2, sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
})();

// ---------- LABEL SPRITES ----------
function makeLabel(text, opts){
  const {fontSize=34, color='#e8eaf0', bg=null, bold=false, pad=18} = opts||{};
  const dpr = 2;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const font = `${bold?'600':'400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2;
  const h = fontSize + pad*2;
  cv.width = w*dpr; cv.height = h*dpr;
  ctx.scale(dpr,dpr);
  if(bg){
    ctx.fillStyle = bg;
    const r = h/2;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(w-r,0); ctx.arc(w-r,r,r,-Math.PI/2,Math.PI/2);
    ctx.lineTo(r,h); ctx.arc(r,r,r,Math.PI/2,-Math.PI/2); ctx.fill();
  }
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, h/2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sp = new THREE.Sprite(mat);
  const scale = (opts&&opts.worldH) || 3;
  sp.scale.set(scale * w/h, scale, 1);
  return sp;
}

// ---------- LAYOUT ----------
const R1 = 26, R2 = 15, R3 = 9;
const nodes = [], branchGroups = [];
const raycastTargets = [];

function branchDirs(n){
  // spread level-1 branches on a sphere (fibonacci)
  const dirs = [];
  const off = 2/n, inc = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = i*off - 1 + off/2;
    const r = Math.sqrt(1-y*y);
    const phi = i*inc;
    dirs.push(new THREE.Vector3(Math.cos(phi)*r, y*0.75, Math.sin(phi)*r).normalize());
  }
  return dirs;
}

function addSphere(pos, radius, color, emissiveScale){
  const geo = new THREE.SphereGeometry(radius, 20, 16);
  const mat = new THREE.MeshBasicMaterial({color});
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  return m;
}

function addLine(a, b, color, opacity){
  const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
  const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity});
  return new THREE.Line(geo, mat);
}

// root
const rootSphere = addSphere(new THREE.Vector3(0,0,0), 2.6, 0xe8eaf0);
root3d.add(rootSphere);
const rootLabel = makeLabel("BOX OF ROX", {fontSize:44, bold:true, color:'#0a0e14', bg:'#e8eaf0', worldH:3.4});
rootLabel.position.set(0, 4.6, 0);
root3d.add(rootLabel);

const dirs = branchDirs(DATA.children.length);
const legendEl = document.getElementById('legend');

DATA.children.forEach((branch, bi)=>{
  const color = branch.color;
  const cHex = '#'+color.toString(16).padStart(6,'0');
  const bg = new THREE.Group();
  bg.userData = {branchIndex:bi};
  root3d.add(bg);
  branchGroups.push(bg);

  // legend
  const lg = document.createElement('div');
  lg.className = 'lg';
  lg.innerHTML = `<span class="dot" style="background:${cHex}"></span>${branch.name}`;
  legendEl.appendChild(lg);

  const p1 = dirs[bi].clone().multiplyScalar(R1);
  bg.add(addLine(new THREE.Vector3(0,0,0), p1, color, 0.55));
  const s1 = addSphere(p1, 1.7, color);
  s1.userData = {branchIndex:bi};
  bg.add(s1); raycastTargets.push(s1);
  const l1 = makeLabel(branch.name, {fontSize:38, bold:true, color:'#0a0e14', bg:cHex, worldH:2.6});
  l1.position.copy(p1).add(new THREE.Vector3(0,3.1,0));
  bg.add(l1);

  const kids = branch.children||[];
  kids.forEach((kid, ki)=>{
    // cone around branch direction
    const axis = dirs[bi];
    const ortho1 = new THREE.Vector3(0,1,0).cross(axis).normalize();
    if(ortho1.lengthSq()<0.01) ortho1.set(1,0,0);
    const ortho2 = axis.clone().cross(ortho1).normalize();
    const ang = (ki/Math.max(kids.length,1))*Math.PI*2;
    const spread = 0.85;
    const dir2 = axis.clone()
      .add(ortho1.clone().multiplyScalar(Math.cos(ang)*spread))
      .add(ortho2.clone().multiplyScalar(Math.sin(ang)*spread))
      .normalize();
    const p2 = p1.clone().add(dir2.multiplyScalar(R2));
    bg.add(addLine(p1, p2, color, 0.38));
    const s2 = addSphere(p2, 1.0, color);
    s2.userData = {branchIndex:bi};
    bg.add(s2); raycastTargets.push(s2);
    const l2 = makeLabel(kid.name, {fontSize:32, color:'#dfe3ee', worldH:1.9});
    l2.position.copy(p2).add(new THREE.Vector3(0,2.0,0));
    bg.add(l2);

    (kid.children||[]).forEach((leaf, li)=>{
      const n2 = (kid.children.length);
      const a2 = (li/n2)*Math.PI*2 + 0.5;
      const o1 = new THREE.Vector3(0,1,0).cross(dir2).normalize();
      if(o1.lengthSq()<0.01) o1.set(1,0,0);
      const o2b = dir2.clone().cross(o1).normalize();
      const d3 = dir2.clone()
        .add(o1.clone().multiplyScalar(Math.cos(a2)*0.95))
        .add(o2b.clone().multiplyScalar(Math.sin(a2)*0.95))
        .normalize();
      const p3 = p2.clone().add(d3.multiplyScalar(R3));
      bg.add(addLine(p2, p3, color, 0.25));
      const s3 = addSphere(p3, 0.55, color);
      s3.userData = {branchIndex:bi};
      bg.add(s3); raycastTargets.push(s3);
      const l3 = makeLabel(leaf.name, {fontSize:28, color:'#9aa3ba', worldH:1.4});
      l3.position.copy(p3).add(new THREE.Vector3(0,1.3,0));
      bg.add(l3);
    });
  });
});

// ---------- FOCUS (tap branch) ----------
let focused = -1;
function setFocus(bi){
  focused = (focused===bi) ? -1 : bi;
  branchGroups.forEach((g,i)=>{
    const dim = (focused!==-1 && i!==focused);
    g.traverse(o=>{
      if(o.material){
        o.material.opacity = dim ? (o.isLine?0.06:0.12) : (o.isLine ? o.userData.baseOp ?? o.material.opacity : 1);
        o.material.transparent = true;
      }
    });
  });
}
// store base line opacities
branchGroups.forEach(g=>g.traverse(o=>{ if(o.isLine) o.userData.baseOp = o.material.opacity; }));

// ---------- CONTROLS (custom orbit: full free rotation) ----------
let rotVel = {x:0.0008, y:0.0025}; // idle spin
let dragging=false, lastX=0, lastY=0, pinchDist=0, interacted=false, moved=0;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function rotate(dx, dy){
  // rotate around camera-relative axes → any direction
  const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dx);
  const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), dy);
  root3d.quaternion.premultiply(qx).premultiply(qy);
}
function zoom(f){
  camDist = THREE.MathUtils.clamp(camDist*f, 18, 300);
}

canvas.addEventListener('pointerdown', e=>{
  dragging=true; interacted=true; moved=0;
  lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved += Math.abs(dx)+Math.abs(dy);
  lastX=e.clientX; lastY=e.clientY;
  rotate(dx*0.005, dy*0.005);
  rotVel.x = dy*0.0006; rotVel.y = dx*0.0006;
});
canvas.addEventListener('pointerup', e=>{
  dragging=false;
  if(moved<6){ // tap → raycast
    pointer.x = (e.clientX/innerWidth)*2-1;
    pointer.y = -(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(raycastTargets);
    if(hits.length) setFocus(hits[0].object.userData.branchIndex);
    else if(focused!==-1) setFocus(focused); // tap empty → clear
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault(); interacted=true;
  zoom(e.deltaY>0 ? 1.1 : 0.9);
},{passive:false});

// pinch
const touches = new Map();
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    dragging=false;
  }
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    const p = touches.get(t.identifier);
    if(p){ p.x=t.clientX; p.y=t.clientY; }
  }
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchDist>0) zoom(pinchDist/d);
    pinchDist = d;
    interacted=true;
  }
},{passive:true});
canvas.addEventListener('touchend', e=>{
  for(const t of e.changedTouches) touches.delete(t.identifier);
  pinchDist=0;
},{passive:true});

// ---------- RESIZE / LOOP ----------
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function tick(){
  requestAnimationFrame(tick);
  if(!dragging){
    if(!interacted){ rotate(rotVel.y, rotVel.x); }
    else { rotVel.x*=0.94; rotVel.y*=0.94; rotate(rotVel.y, rotVel.x); }
  }
  camera.position.set(0,0,camDist);
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
