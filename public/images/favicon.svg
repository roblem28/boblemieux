<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bob LeMieux">
  <!-- Replaces the starter kit's letter "P", which was also fill="#000" and so
       invisible against a dark browser tab. Solid brand-primary ground means the
       mark stays visible in either tab theme even if the glyph fails to render. -->
  <rect width="64" height="64" rx="10" fill="#0804F6"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="34" font-weight="500" fill="#FBFFF2" letter-spacing="-1">BL</text>
</svg>
