[build]
  publish = ".next"
  command = "npm run build"

# NYT Daily Digest is built by a separate Python repo (roblem28/nyt-digest) and
# deployed to its own Netlify project. Proxying it under /projects/nyt/embed
# puts it on this origin, so /projects/nyt can measure the iframe directly
# instead of negotiating height over postMessage.
#
# The embed path is deliberately distinct from /projects/nyt itself: a rule on
# /projects/nyt/* risks shadowing the Next.js page that renders the chrome.
[[redirects]]
  from = "/projects/nyt/embed"
  to = "https://nyt-digest.netlify.app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/projects/nyt/embed/*"
  to = "https://nyt-digest.netlify.app/:splat"
  status = 200
  force = true

# ObstacleBoy is a Unity WebGL build living in its own repo (obstacleboy-web) and
# its own Netlify project. Proxying it under /games/obstacleboy puts it on this
# origin alongside the static games in public/games.
#
# The bare path redirects rather than proxying, which is the one place this differs
# from the /projects/nyt/embed rules above. Unity's index.html references its
# payload relatively ("Build/...", "StreamingAssets/..."), and a browser sitting on
# /games/obstacleboy with no trailing slash resolves those against /games/ - so a
# 200 proxy there would serve the page and then 404 every asset it asks for. The
# 301 moves the browser onto the trailing-slash form first; the wildcard rule below
# then covers the document and its payload alike.
[[redirects]]
  from = "/games/obstacleboy"
  to = "/games/obstacleboy/"
  status = 301
  force = true

# Matches the trailing-slash document with an empty splat, and every asset under
# it. force = true because the Next.js catch-all route ([[...slug]].tsx) would
# otherwise be a candidate for these paths.
[[redirects]]
  from = "/games/obstacleboy/*"
  to = "https://obstacleboy.netlify.app/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"