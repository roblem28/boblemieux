[build]
  publish = ".next"
  command = "npm run build"

# NYT Daily Digest is built by a separate Python repo (roblem28/nyt-digest) and
# deployed to its own Netlify project. Proxying it under /projects/nyt/embed
# puts it on this origin, so /projects/nyt can measure the iframe directly
# instead of negotiating height over postMessage.
#
# The embed path is deliberately distinct from /projects/nyt itself: a rule on
# /projects/nyt/* risks shadowing the Next.js page that renders the chrome.
[[redirects]]
  from = "/projects/nyt/embed"
  to = "https://nyt-digest.netlify.app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/projects/nyt/embed/*"
  to = "https://nyt-digest.netlify.app/:splat"
  status = 200
  force = true

# ObstacleBoy is a Unity WebGL build living in its own repo (obstacleboy-web) and
# its own Netlify project. Proxying it under /games/obstacleboy puts it on this
# origin alongside the static games in public/games.
#
# One rule covers both /games/obstacleboy and /games/obstacleboy/, because Netlify
# ignores trailing slashes when matching - the bare path hits this rule with an
# empty splat. That same normalisation is why there is no "redirect the bare path
# to the trailing-slash form" rule here: such a rule matches the slashed form too
# and redirects it to itself, which is an infinite loop rather than a tidy-up.
#
# Unity references its payload relatively ("Build/...", "StreamingAssets/..."), so
# on the bare path a browser would resolve those against /games/. That is fixed in
# the game's own index.html, which pins a <base> when it is served from a path with
# no trailing slash - the only place with enough information to do it.
#
# force = true because the Next.js catch-all route ([[...slug]].tsx) would
# otherwise be a candidate for these paths.
[[redirects]]
  from = "/games/obstacleboy/*"
  to = "https://obstacleboy.netlify.app/:splat"
  status = 200
  force = true

# IA consolidation. /work-projects became /work/systems (it is controls systems
# built on live programmes, and belongs under Work), and /tech-projects was a
# second, smaller view of the same set /projects already shows.
#
# Both are 301s rather than deletions: the URLs stay reachable, keep their link
# equity, and anything already pointing at them still lands somewhere correct.
#
# force = true because the Next.js catch-all ([[...slug]].tsx) would otherwise
# be a candidate for these paths.
[[redirects]]
  from = "/work-projects"
  to = "/work/systems/"
  status = 301
  force = true

[[redirects]]
  from = "/work-projects/*"
  to = "/work/systems/"
  status = 301
  force = true

[[redirects]]
  from = "/tech-projects"
  to = "/projects/"
  status = 301
  force = true

[[redirects]]
  from = "/tech-projects/*"
  to = "/projects/"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
# Cache headers. Without these every asset served max-age=0, so 2.08 MB of
# images revalidated on every navigation.
#
# The Next.js plugin already fingerprints and caches /_next/static itself; the
# rule below is stated explicitly so the policy is visible in one place.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Copied from node_modules by scripts/copy-vendor-css.mjs at build time. Not
# fingerprinted, so it revalidates daily rather than being pinned for a year.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Content images change only on redeploy, but the filenames are stable, so a
# week with revalidation rather than an immutable year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Static apps outside the Next pipeline: the games, the comic, /wire and the
# mindmap widget. Their payloads are large and change rarely.
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/comics/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Baseline security headers. No CSP here: /wire, the games and the comic use
# inline scripts and styles, so a policy strict enough to be worth setting would
# break them. That needs its own pass.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
